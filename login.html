<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Access | Student, Agent & Admin Login - Study Partners</title>
  <meta name="description" content="Sign in to Study Partners Student Portal, Authorized Agent Portal, or University Admin Dashboard.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; background: linear-gradient(180deg, #EFFDF5 0%, #F8FAFC 50%, #EFF6FF 100%);">

  <!-- Minimal Brand Header -->
  <div style="padding: 2rem 0 1rem; text-align: center;">
    <a href="index.html" class="brand-logo" style="display: inline-flex; align-items: center; justify-content: center;">
      <img src="images/logo.png" alt="Study Partners" class="brand-logo-img" style="height: 54px;">
    </a>
  </div>

  <!-- Auth Card Container -->
  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1.5rem;">
    <div style="background: var(--white); border-radius: var(--radius-2xl); box-shadow: var(--shadow-xl); width: 100%; max-width: 480px; overflow: hidden; border: 1px solid var(--neutral-200);">
      
      <!-- Role Tabs -->
      <div style="display: grid; grid-template-columns: repeat(3, 1fr); background: var(--neutral-100); border-bottom: 1px solid var(--neutral-200); padding: 0.35rem;">
        <button type="button" class="role-tab active" data-role="student" style="padding: 0.75rem 0.5rem; border: none; background: var(--white); font-family: var(--font-heading); font-size: 0.85rem; font-weight: 700; color: var(--sp-green); border-radius: var(--radius-md); cursor: pointer; transition: all var(--transition-fast);">
          Student
        </button>
        <button type="button" class="role-tab" data-role="agent" style="padding: 0.75rem 0.5rem; border: none; background: transparent; font-family: var(--font-heading); font-size: 0.85rem; font-weight: 600; color: var(--neutral-600); border-radius: var(--radius-md); cursor: pointer; transition: all var(--transition-fast);">
          Agent
        </button>
        <button type="button" class="role-tab" data-role="admin" style="padding: 0.75rem 0.5rem; border: none; background: transparent; font-family: var(--font-heading); font-size: 0.85rem; font-weight: 600; color: var(--neutral-600); border-radius: var(--radius-md); cursor: pointer; transition: all var(--transition-fast);">
          Admin
        </button>
      </div>

      <div style="padding: 2.25rem;">
        <div style="text-align: center; margin-bottom: 1.75rem;">
          <h2 id="roleLoginTitle" style="font-size: 1.5rem; color: var(--primary-900);">Student Dashboard Sign In</h2>
          <p id="roleLoginSubtitle" style="font-size: 0.85rem; color: var(--neutral-500); margin-top: 0.25rem;">
            Track your 6-stage application pipeline and download letters.
          </p>
        </div>

        <form id="portalLoginForm" onsubmit="handlePortalLogin(event);">
          <div class="form-group">
            <label class="form-label" for="loginEmail">Email Address</label>
            <input type="email" id="loginEmail" class="form-input" placeholder="student@example.com" value="tendai.student@studypartners.co.zw" required>
          </div>

          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <label class="form-label" for="loginPassword">Password</label>
              <a href="#" style="font-size: 0.75rem; color: var(--sp-green); font-weight: 600;" onclick="alert('Password reset link sent to registered email.'); return false;">Forgot?</a>
            </div>
            <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" value="Password2026!" required>
          </div>

          <button type="submit" id="loginSubmitBtn" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.85rem;">
            Sign In to Portal &rarr;
          </button>
        </form>

        <!-- Demo Quick Role Switcher -->
        <div style="margin-top: 2rem; padding: 1rem; background: var(--neutral-50); border: 1px dashed var(--neutral-300); border-radius: var(--radius-md);">
          <div style="font-size: 0.75rem; font-weight: 700; color: var(--neutral-600); text-transform: uppercase; margin-bottom: 0.5rem; text-align: center;">
            Demo Credentials Pre-fill:
          </div>
          <div style="display: flex; gap: 0.4rem; justify-content: center; flex-wrap: wrap;">
            <button type="button" class="btn btn-secondary btn-sm" onclick="setRole('student')">Student Demo</button>
            <button type="button" class="btn btn-secondary btn-sm" onclick="setRole('agent')">Agent Demo</button>
            <button type="button" class="btn btn-secondary btn-sm" onclick="setRole('admin')">Admin Demo</button>
          </div>
        </div>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--neutral-600);">
          Don't have an account yet? 
          <a href="register.html" style="color: var(--sp-green); font-weight: 700;">Create Student Account &rarr;</a>
        </div>
      </div>
    </div>
  </main>

  <footer style="text-align: center; padding: 1.5rem; color: var(--neutral-500); font-size: 0.8rem;">
    &copy; 2026 Study Partners. 5 Premium Close, Mount Pleasant, Harare. Return to <a href="index.html" style="color: var(--sp-green); font-weight: 700;">Public Homepage</a>
  </footer>

  <script src="js/main.js"></script>
  <script>
    let activeRole = 'student';

    function setRole(role) {
      activeRole = role;
      document.querySelectorAll('.role-tab').forEach(tab => {
        tab.style.background = 'transparent';
        tab.style.color = 'var(--neutral-600)';
        tab.classList.remove('active');
        if (tab.dataset.role === role) {
          tab.style.background = 'var(--white)';
          tab.style.color = 'var(--sp-green)';
          tab.classList.add('active');
        }
      });

      const title = document.querySelector('#roleLoginTitle');
      const subtitle = document.querySelector('#roleLoginSubtitle');
      const email = document.querySelector('#loginEmail');

      if (role === 'student') {
        title.textContent = 'Student Dashboard Sign In';
        subtitle.textContent = 'Track your 6-stage application pipeline and download letters.';
        email.value = 'tendai.student@studypartners.co.zw';
      } else if (role === 'agent') {
        title.textContent = 'Authorized Agent Portal';
        subtitle.textContent = 'Register students with your referral code and view commissions.';
        email.value = 'agent.harare@studypartners.co.zw';
      } else if (role === 'admin') {
        title.textContent = 'University Admin Panel';
        subtitle.textContent = 'Review dossiers, issue official letters, and manage admissions.';
        email.value = 'registrar@studypartners.co.zw';
      }
    }

    document.querySelectorAll('.role-tab').forEach(tab => {
      tab.addEventListener('click', () => setRole(tab.dataset.role));
    });

    // Check query params
    const urlParams = new URLSearchParams(window.location.search);
    const roleParam = urlParams.get('role');
    if (roleParam) setRole(roleParam);

    function handlePortalLogin(e) {
      e.preventDefault();
      showToast(`Signed in successfully as ${activeRole.toUpperCase()}! Opening dashboard...`, 'success');
      setTimeout(() => {
        if (activeRole === 'student') {
          window.location.href = 'index.html#portal-showcase';
        } else if (activeRole === 'agent') {
          showToast('Agent Portal initialized. Phase 5 backend integration ready.', 'info');
        } else {
          showToast('Admin Panel initialized. Phase 4 backend integration ready.', 'info');
        }
      }, 1000);
    }
  </script>
</body>
</html>
